{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;"><div class="card-dark" style="text-align:center;">
  <div style="font-size:30px;margin-bottom:10px;">⚠️</div>
  <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;margin-bottom:8px;">Deactivate Company?</div>
  <div style="color:var(--text-muted);font-size:13px;margin-bottom:18px;">"{{ company.name }}" will be deactivated. Their users will lose access.</div>
  <div class="d-flex gap-2 justify-content-center">
    <form method="post">{% csrf_token %}<button type="submit" style="background:var(--danger);border:none;color:#fff;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Deactivate</button></form>
    <a href="{% url 'superadmin:company_list' %}" class="btn-ghost">Cancel</a>
  </div>
</div></div>
{% endblock %}
