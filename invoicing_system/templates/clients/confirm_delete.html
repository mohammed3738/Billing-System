{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;"><div class="card-dark">
  <div style="font-size:32px;text-align:center;margin-bottom:12px;">⚠️</div>
  <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;text-align:center;margin-bottom:8px;">Deactivate Client?</div>
  <div style="color:var(--text-muted);font-size:13px;text-align:center;margin-bottom:20px;">{{ client.vendor_name }} will be hidden from lists.</div>
  <div class="d-flex gap-2 justify-content-center">
    <form method="post">{% csrf_token %}<button type="submit" style="background:var(--danger);border:none;color:#fff;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Deactivate</button></form>
    <a href="{% url 'clients:list' %}" class="btn-ghost">Cancel</a>
  </div>
</div></div>
{% endblock %}
