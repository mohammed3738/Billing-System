{% extends "base.html" %}
{% load static %}
{% block auth_content %}
<div style="min-height:100vh;background:var(--bg-dark);display:flex;align-items:center;justify-content:center;">
  <div style="width:380px;">
    <div style="text-align:center;margin-bottom:32px;">
      <img src="{% static 'images/taxporium-logo.jpeg' %}" alt="Taxporium" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto 18px;"/>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;">Taxporium</div>
      <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">Invoicing & Billing System</div>
    </div>
    <div class="card-dark">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-bottom:20px;">Sign In</div>
      {% if form.errors %}
      <div class="alert-tfs alert-error-tfs mb-3"><i class="fa fa-circle-exclamation me-2"></i>Invalid credentials. Please try again.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn-accent w-100" style="padding:10px;">Sign In <i class="fa fa-arrow-right ms-2"></i></button>
      </form>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted);">
      Run <code style="color:var(--accent)">python manage.py createsuperuser</code> to create admin
    </div>
  </div>
</div>
{% endblock %}
